<div class="modal-backdrop">
  <div class="modal confirm-modal">
    <div class="modal-body" style="align-items:flex-start">
      <div class="confirm-icon" [class.danger]="danger">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="24" height="24"
             [style.color]="danger ? 'var(--error)' : 'var(--warning)'">
          <path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/>
          <line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>
        </svg>
      </div>
      <div>
        <div class="modal-title" style="margin-bottom:6px">{{ title }}</div>
        <p class="text-sm text-muted">{{ message }}</p>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" (click)="cancelled.emit()">Cancel</button>
      <button class="btn" [class.btn-danger]="danger" [class.btn-primary]="!danger"
              (click)="confirmed.emit()">{{ confirmLabel }}</button>
    </div>
  </div>
</div>
