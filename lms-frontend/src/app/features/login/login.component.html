<div class="login-page">
  <div class="login-card">
    <div class="login-brand">
      <div class="brand-icon">
        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24"
          fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/>
          <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
        </svg>
      </div>
      <h1 class="brand-name">LearnHub</h1>
    </div>

    <div class="login-header">
      <h2>{{ mode === 'login' ? 'Welcome back' : 'Create your account' }}</h2>
      <p>{{ mode === 'login' ? 'Sign in to continue to LearnHub' : 'Sign up to get started with LearnHub' }}</p>
    </div>

    <form (ngSubmit)="submit()" #f="ngForm" novalidate>
      <div class="form-group" *ngIf="mode === 'signup'">
        <label class="form-label" for="signup-name">Full name</label>
        <input id="signup-name" class="form-control" type="text" [(ngModel)]="name"
          name="name" placeholder="Enter your full name" autocomplete="name" required maxlength="100" />
      </div>

      <div class="form-group">
        <label class="form-label" [for]="mode === 'login' ? 'login-username' : 'signup-email'">
          {{ mode === 'login' ? 'Username or email' : 'Email' }}
        </label>
        <input *ngIf="mode === 'login'" id="login-username" class="form-control" type="text" [(ngModel)]="username"
          name="username" placeholder="Enter username or email" autocomplete="username" required />
        <input *ngIf="mode === 'signup'" id="signup-email" class="form-control" type="email" [(ngModel)]="email"
          name="email" placeholder="you@example.com" autocomplete="email" required email />
      </div>

      <div class="form-group">
        <label class="form-label" for="auth-password">Password</label>
        <input class="form-control" type="password" [(ngModel)]="password"
          id="auth-password" name="password" placeholder="Enter password"
          [autocomplete]="mode === 'login' ? 'current-password' : 'new-password'"
          [attr.minlength]="mode === 'signup' ? 8 : null" required />
      </div>

      <div class="form-group" *ngIf="mode === 'signup'">
        <label class="form-label" for="signup-setup-code">Admin setup code <span class="text-muted">(only if provided)</span></label>
        <input id="signup-setup-code" class="form-control" type="text" [(ngModel)]="setupCode"
          name="setupCode" placeholder="Enter your one-time setup code" autocomplete="one-time-code" />
      </div>

      <div class="form-group" *ngIf="mode === 'signup'">
        <label class="form-label" for="confirm-password">Confirm password</label>
        <input id="confirm-password" class="form-control" type="password" [(ngModel)]="confirmPassword"
          name="confirmPassword" placeholder="Re-enter your password" autocomplete="new-password" required />
      </div>

      <div class="login-error" *ngIf="error">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
          fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
        {{ error }}
      </div>

      <button type="submit" class="btn btn-primary w-full login-btn" [disabled]="loading">
        <span *ngIf="loading" class="spinner-sm"></span>
        <span>{{ loading ? (mode === 'login' ? 'Signing in...' : 'Creating account...') : (mode === 'login' ? 'Sign In' : 'Create Account') }}</span>
      </button>
    </form>

    <button type="button" class="auth-switch" (click)="switchMode()" [disabled]="loading">
      {{ mode === 'login' ? "Don't have an account? Sign up" : 'Already have an account? Sign in' }}
    </button>

    <div class="login-hint" *ngIf="mode === 'login'">
      <span>Default credentials:</span>
      <code>admin / admin123</code>
    </div>
  </div>
</div>
